<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7B61FF"/>
      <stop offset="1" stop-color="#D4A853"/>
    </linearGradient>
    <radialGradient id="ball" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(50 46) rotate(90) scale(34)">
      <stop stop-color="white" stop-opacity="0.88"/>
      <stop offset="0.6" stop-color="#C8B8FF" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#7B61FF" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- Crystal ball body -->
  <circle cx="60" cy="54" r="34" fill="url(#ball)"/>
  <circle cx="60" cy="54" r="34" stroke="white" stroke-opacity="0.5" stroke-width="1.5"/>
  <!-- Highlight -->
  <ellipse cx="50" cy="44" rx="10" ry="6" fill="white" fill-opacity="0.35" transform="rotate(-20 50 44)"/>
  <!-- Stand base -->
  <rect x="54" y="84" width="12" height="7" rx="3" fill="white" fill-opacity="0.3"/>
  <ellipse cx="60" cy="92" rx="16" ry="4" fill="white" fill-opacity="0.2"/>
  <!-- Stars inside ball -->
  <circle cx="50" cy="47" r="2.5" fill="#FFD700"/>
  <circle cx="70" cy="43" r="1.5" fill="white" fill-opacity="0.95"/>
  <circle cx="58" cy="62" r="2" fill="#FFD700" fill-opacity="0.8"/>
  <circle cx="73" cy="58" r="1.5" fill="white" fill-opacity="0.75"/>
  <circle cx="44" cy="60" r="1.5" fill="#FFD700" fill-opacity="0.65"/>
  <!-- Sparkle top-left -->
  <line x1="41" y1="36" x2="41" y2="30" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="38" y1="33" x2="44" y2="33" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="38.8" y1="30.8" x2="43.2" y2="35.2" stroke="white" stroke-width="1" stroke-linecap="round"/>
  <line x1="43.2" y1="30.8" x2="38.8" y2="35.2" stroke="white" stroke-width="1" stroke-linecap="round"/>
</svg>
